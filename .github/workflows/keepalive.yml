# Keeps the free license server awake (Render puts it to sleep after 15 minutes without requests).
# The route used does not touch the database. Set the repository variable LICENSE_SERVER_URL.
name: Serveur de licences éveillé

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping
        env:
          SERVER: ${{ vars.LICENSE_SERVER_URL }}
        run: |
          test -n "$SERVER" || { echo "Variable LICENSE_SERVER_URL non définie."; exit 0; }
          curl --fail --silent --show-error --max-time 100 --retry 2 --retry-delay 5 "${SERVER%/}/api/v1/ping"
